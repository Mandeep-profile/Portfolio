<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="lollyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Bevel Border -->
    <linearGradient id="lollyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="lollyTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="lollyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(8, 8)" filter="url(#lollyShadow)">
    <rect width="44" height="44" rx="13" fill="url(#lollyBg)" />
    <rect x="0.5" y="0.5" width="43" height="43" rx="12.5" stroke="url(#lollyBorder)" stroke-width="1" />
    
    <!-- Streaming Play Triangle + Waves -->
    <path d="M19 15.5C17.9 14.8 16.5 15.6 16.5 16.9V31.1C16.5 32.4 17.9 33.2 19 32.5L30.5 25.4C31.5 24.8 31.5 23.2 30.5 22.6L19 15.5Z" fill="#FFFFFF"/>
    <!-- Audio / Visual Wave Lines -->
    <path d="M34 19C35.5 20.5 36.5 22.5 36.5 24.8C36.5 27.1 35.5 29.1 34 30.6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Modern Brand Wordmark -->
  <text x="62" y="35" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Lolly<tspan fill="url(#lollyTextGrad)">App</tspan>
  </text>
  
  <!-- Sub-label -->
  <text x="63" y="47" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="2.2">
    VIDEO STREAMING
  </text>
</svg>
